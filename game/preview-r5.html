<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>tostarena preview</title>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #dca066; overflow: hidden; }
      #err { position: fixed; left: 8px; top: 8px; color: #fff; font: 13px monospace;
             white-space: pre-wrap; z-index: 9; text-shadow: 0 1px 2px #000; }
    </style>
  </head>
  <body>
    <div id="err"></div>
    <script type="module">
      import * as THREE from "three";
      import { tostarena } from "./src/themes/tostarena.js";

      const errEl = document.getElementById("err");
      const say = (m) => { errEl.textContent += m + "\n"; };
      window.addEventListener("error", (e) => say("ERR: " + e.message));

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = tostarena.exposure;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(tostarena.fog);

      const hemi = new THREE.HemisphereLight(
        tostarena.hemi[0], tostarena.hemi[1], tostarena.hemi[2]);
      scene.add(hemi);
      const fill = new THREE.DirectionalLight(tostarena.fill, tostarena.fillIntensity);
      fill.position.set(20, 12, 19);
      scene.add(fill);

      const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 400);

      let firedChain = -1;
      function makeFrame(t, A) {
        const C = A / 2;
        // demo the Chain-Chomp reel-in on a 1.6s loop: red (puller) fixed, blue
        // (victim) starts far + slides in to point-blank while stunned (dizzy stars).
        const CYC = 1.6, cyc = t % CYC, ix = Math.floor(t / CYC);
        const red = [C + 1.5, C];
        const far = [C - 6, C + 0.6], near = [C + 3.2, C];
        const pu = Math.max(0, Math.min(1, (cyc - 0.05) / 0.5));
        const e = pu * pu * (3 - 2 * pu);              // smoothstep reel-in
        const blue = [far[0] + (near[0] - far[0]) * e, far[1] + (near[1] - far[1]) * e];
        const events = [];
        if (ix !== firedChain) {
          firedChain = ix;
          events.push({ id: 900 + ix, type: "chain", side: "red", target: "blue" });
        }
        return {
          red, blue,
          redVel: [0, 0], blueVel: [0, 0],
          flag: { pos: [C, C], holder: null, radius: 0.75 },
          captures: { red: 1, blue: 0 }, capturesToWin: 3,
          stun: { red: 0, blue: 1.0 },         // blue stunned -> cartoon dizzy stars
          weapons: { red: "green_shell", blue: "banana" },  // must NOT show an in-world badge now
          crates: [{ id: 2, pos: [C - 6, C + 4], radius: 0.55 }],
          shells: [
            { id: 1, owner: "red", kind: "green", pos: [C + 4.5, C - 3], vel: [0, 5], radius: 0.35 },
          ],
          traps: [
            { id: 1, owner: "red", kind: "banana", pos: [C + 4.5, C + 3.5], radius: 0.7 },
            { id: 2, owner: "blue", kind: "oil", pos: [C - 4.5, C - 3.5], radius: 0.7 },
          ],
          ctfEvents: events,
        };
      }

      async function main() {
        let world;
        try {
          const r = await fetch("/api/world", { cache: "no-store" });
          world = (await r.json()).world;
          say(`world ${world.theme} arena=${world.arena} ctf.weapons=${world.ctf?.weapons}`);
        } catch (e) { say("world fetch failed: " + e.message); return; }
        const A = world.arena || 26, C = A / 2;
        camera.position.set(C, A * 0.78, A * 1.42);
        camera.lookAt(new THREE.Vector3(C, 1, C));

        let theme;
        try {
          theme = tostarena.buildScene(scene, world, { renderer });
          say("buildScene ok");
        } catch (e) { say("buildScene ERR: " + e.message + "\n" + e.stack); return; }

        const t0 = performance.now();
        renderer.setAnimationLoop(() => {
          const t = (performance.now() - t0) / 1000;
          try { theme.update(t, 0.016, makeFrame(t, A)); }
          catch (e) { say("update ERR: " + e.message); renderer.setAnimationLoop(null); return; }
          renderer.render(scene, camera);
        });
      }
      main();
    </script>
  </body>
</html>
