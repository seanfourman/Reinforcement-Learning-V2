<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rival Minds</title>
    <link rel="icon" type="image/png" href="./assets/ui/favicon.png" />
    <!-- load the cap sprite + the solid-cap mask up front so the boot screen
         animates instantly and the reveal wipe has no glitch -->
    <link rel="preload" as="image" href="./assets/ui/cap-loader.png" />
    <link rel="preload" as="image" href="./assets/ui/cap-solid.png" />
    <link rel="preload" as="image" href="./assets/ui/cap-badge.png" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background: #1a1c2c;
        font-family: "Segoe UI", system-ui, sans-serif;
        /* the touch tap flash is its own property (it fires on tap, not on :focus),
           so it cannot live in the focus rule below */
        -webkit-tap-highlight-color: transparent;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      * {
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }
      /* No focus ring ANYWHERE. Every module injects its own <style> into <head> at
         runtime, so they all land later in the cascade than this file AND out-specify
         `*:focus`; !important is what makes this win, since author-important is
         decided before specificity or document order. Kept as ONE selector (not a
         `*:focus,*:focus-visible` group): :focus-visible is a strict subset of :focus,
         so grouping buys nothing and an engine that does not know :focus-visible
         would throw the whole group away. */
      *:focus {
        outline: none !important;
      }
      /* legacy Firefox (<52) drew an inner dotted button border that is NOT an
         outline, so outline:none never removed it. A no-op on modern browsers. */
      ::-moz-focus-inner {
        border: 0 !important;
        padding: 0 !important;
      }
      /* Mario-style boot loader: a plain white screen with a spinning Mario-cap
         sprite (ripped from Odyssey's screen transitions). It is pure CSS, so it
         paints from the FIRST frame - before three.js or any asset loads - which
         is the whole point of a loading screen. loadscreen.js only fades it away
         once loading is actually finished. */
      #loadscreen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* the cap: an 8-frame strip inside a one-cell window, stepped with a
         translate. transform is GPU-composited, so the spin stays smooth even
         while the round scenes are being parsed on the main thread. Cell aspect
         ~1.76; height 24vmin so it scales with the viewport. */
      #capwin {
        width: 42.2vmin;
        height: 24vmin;
        overflow: hidden;
      }
      #capstrip {
        display: block;
        width: 337.6vmin; /* 8 cells */
        height: 24vmin;
        /* cold start: spin with pure CSS so the cap tumbles from the FIRST paint,
           before main.js's module graph (three.js + themes) has even parsed.
           loadscreen.js takes over the frames once it loads (so finish() can land
           the tumble smoothly on frame 0). */
        animation: capspin 0.85s steps(8) infinite;
        will-change: transform;
      }
      @keyframes capspin {
        to { transform: translate3d(-337.6vmin, 0, 0); }
      }
      /* reveal: after the cap lands, the white gets a cap-shaped HOLE (scene
         shows inside the cap, white outside) that GROWS until the white is gone.
         The hole is mask-composite (fill XOR cap) so the white ALWAYS covers
         everything except the hole, at any size; JS grows it via --hole (set on
         :root so #capbadge, a sibling, reads the same value). cap-solid.png is an
         opaque solid-cap silhouette. */
      #loadscreen.grow #capwin { display: none; }
      #loadscreen.grow {
        pointer-events: none;
        -webkit-mask-image: url("./assets/ui/cap-solid.png"), -webkit-linear-gradient(#000, #000);
        -webkit-mask-repeat: no-repeat, no-repeat;
        -webkit-mask-position: center, center;
        -webkit-mask-size: var(--hole, 42.2vmin) auto, 101% 101%;
        -webkit-mask-composite: xor;
        mask-image: url("./assets/ui/cap-solid.png"), linear-gradient(#000, #000);
        mask-repeat: no-repeat, no-repeat;
        mask-position: center, center;
        mask-size: var(--hole, 42.2vmin) auto, 101% 101%;
        mask-mode: alpha, alpha;
        mask-composite: exclude;
      }
      /* #capfade is a BLACK cap (cap-solid.png is already black-on-transparent)
         over the scene-hole. At the handoff it's opaque = the landed black cap;
         JS fades it out during the wind-up so the BLACK fades out and the SCENE
         fades in where it was (no pop). Same --hole as the hole + badge, so it's
         pixel-aligned. It sits BELOW #capbadge, so the white disc stays on top and
         the badge's cut-out M shows #capfade's black through it at the handoff,
         then the scene once #capfade has faded. */
      #capfade {
        position: fixed;
        inset: 0;
        z-index: 10000;
        opacity: 0;
        pointer-events: none;
        background-image: url("./assets/ui/cap-solid.png");
        background-repeat: no-repeat;
        background-position: center;
        background-size: var(--hole, 42.2vmin) auto;
      }
      /* #capbadge is the white M badge (cap-badge.png: a white disc with the M
         cut out TRANSPARENT, so whatever is behind shows through the M). It sits
         over #capfade at the same full-cell geometry + --hole, so it rides ON the
         cap as it grows. The disc stays white; the M crossfades black->scene as
         #capfade fades. */
      #capbadge {
        position: fixed;
        inset: 0;
        z-index: 10001;
        opacity: 0;
        pointer-events: none;
        background-image: url("./assets/ui/cap-badge.png");
        background-repeat: no-repeat;
        background-position: center;
        background-size: var(--hole, 42.2vmin) auto;
      }
    </style>
  </head>
  <body>
    <div id="loadscreen">
      <div id="capwin"><img id="capstrip" src="./assets/ui/cap-loader.png" alt="" /></div>
    </div>
    <div id="capfade"></div>
    <div id="capbadge"></div>
    <div id="app"></div>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
