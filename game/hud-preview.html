<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>hud preview</title>
    <style>html,body{margin:0;height:100%;background:#111;}</style>
  </head>
  <body>
    <script type="module">
      import { initHud } from "./src/hud.js";
      initHud();
      const stats = {
        round: { title: "Peach's Castle", index: 0, total: 5,
                 labelBlue: "Value Iteration", labelRed: "Policy Iteration" },
        recentRate: { blue: 0.5, red: 0.28, draw: 0.22 },
        score: { blue: 1, red: 0 },
        algoBlue: "value_iteration", algoRed: "policy_iteration",
      };
      setInterval(
        () => window.dispatchEvent(new CustomEvent("rl-snapshot", { detail: { stats } })),
        80,
      );
      // zoom the blue tag for inspection (no reflow - the HUD keeps its 1280 layout)
      setTimeout(() => {
        const hud = document.getElementById("rl-hud");
        if (hud) { hud.style.transform = "scale(6)"; hud.style.transformOrigin = "20% 12%"; }
      }, 200);
    </script>
  </body>
</html>
