<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ctf preview</title>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #1e2f60; overflow: hidden; }
      #err { position: fixed; left: 8px; top: 8px; color: #ffd; font: 13px monospace;
             white-space: pre-wrap; z-index: 9; }
    </style>
  </head>
  <body>
    <div id="err"></div>
    <script type="module">
      import * as THREE from "three";
      import { tostarena } from "./src/themes/tostarena.js";

      const errEl = document.getElementById("err");
      const say = (m) => { errEl.textContent += m + "\n"; };
      window.addEventListener("error", (e) => say("ERR: " + e.message + "\n" + (e.error?.stack || "")));

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = tostarena.exposure;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(tostarena.fog);
      scene.fog = new THREE.Fog(tostarena.fog, tostarena.fogNear, tostarena.fogFar);
      scene.add(new THREE.HemisphereLight(tostarena.hemi[0], tostarena.hemi[1], tostarena.hemi[2]));
      const fill = new THREE.DirectionalLight(tostarena.fill, tostarena.fillIntensity);
      fill.position.set(20, 12, 19); scene.add(fill);

      const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 300);
      camera.position.set(10, 21, 37);
      camera.lookAt(new THREE.Vector3(10, 0, 9));

      const world = {
        theme: "tostarena", objective: "arena", gameMode: "captureFlag", roundId: 5,
        H: 20, W: 20, arena: 20, shape: "square", decisionDt: 0.05,
        sceneCenter: null, sceneScale: 1.0, goal: null, goalR: null,
        spawns: { red: [17.5, 17.5], blue: [2.5, 2.5] },
        obstacles: [], rows: [], escape: [], slipCells: [],
        ctf: {
          capturesToWin: 3, flagRadius: 0.75, tagRadius: 0.95, homeRadius: 1.5,
          carrySlow: 0.72, stunSeconds: 0.5, flagSpawn: [10, 10], crateRadius: 0.55,
          powerups: ["speed", "chain", "shield", "bomb"],
          bases: { red: [17.5, 17.5], blue: [2.5, 2.5] },
        },
      };

      function agentBox(color) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.5, 0.9, 6, 12),
          new THREE.MeshStandardMaterial({ color, roughness: 0.5, emissive: color, emissiveIntensity: 0.15 }));
        body.position.y = 0.95; body.castShadow = true; g.add(body); scene.add(g);
        return g;
      }
      const redBox = agentBox(0xff5a4d);
      const blueBox = agentBox(0x4da0ff);

      // RED carries the flag home (speed-boosted); BLUE chases, shielded; 1 capture in.
      const frame = {
        continuous: true, gameMode: "captureFlag",
        red: [12.5, 12.5], blue: [10.0, 10.2], redVel: [0.6, 0.6], blueVel: [-0.4, -0.4],
        goal: null, steps: 140, winner: null,
        captures: { red: 1, blue: 0 }, capturesToWin: 3,
        flag: { pos: [12.5, 12.5], holder: "red", radius: 0.75 },
        bases: { red: [17.5, 17.5], blue: [2.5, 2.5] }, homeR: 1.5,
        stun: { red: 0, blue: 0 },
        effects: { red: { speed: 3, shield: 0 }, blue: { speed: 0, shield: 2.5 } },
        crates: [
          { id: 1, pos: [6, 13], radius: 0.55 },
          { id: 2, pos: [14, 6], radius: 0.55 },
          { id: 3, pos: [9, 16], radius: 0.55 },
        ],
        ctfEvents: [],
      };

      let themeScene = null;
      try {
        themeScene = tostarena.buildScene(scene, world, { renderer });
        say("buildScene ok; CTF props built");
      } catch (e) { say("buildScene ERR: " + e.message + "\n" + e.stack); }

      let last = performance.now() / 1000;
      let evId = 100, nextEvent = 0.6, blueStunT = 0;
      renderer.setAnimationLoop(() => {
        const now = performance.now() / 1000;
        const dt = Math.min(0.05, Math.max(0, now - last));
        last = now;
        nextEvent -= dt;
        blueStunT = Math.max(0, blueStunT - dt);
        frame.stun.blue = blueStunT;
        if (nextEvent <= 0) {
          nextEvent = 0.6;
          const kinds = ["crate", "chain", "capture", "grab"];
          const kind = kinds[evId % 4];
          let ev = { id: ++evId, type: kind, side: "red" };
          if (kind === "crate") { ev.pos = [6, 13]; ev.powerup = ["speed", "chain", "shield", "bomb"][evId % 4]; }
          else if (kind === "chain") { ev.pos = frame.red; ev.target = "blue"; blueStunT = 1.0; }
          else if (kind === "capture") ev.pos = [17.5, 17.5];
          else ev.pos = [10, 10];
          frame.ctfEvents = [ev];
        } else {
          frame.ctfEvents = [];
        }
        redBox.position.set(frame.red[0], 0, frame.red[1]);
        blueBox.position.set(frame.blue[0], 0, frame.blue[1]);
        themeScene?.update?.(now, dt, frame);
        renderer.render(scene, camera);
      });
      window.__ctfReady = true;
    </script>
  </body>
</html>
